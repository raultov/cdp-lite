name: Rust

on:
  push:
    branches: [ "master" ]
    # A version tag also creates its GitHub release, once the build passes.
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  # Releases a tag that already exists (its build runs first, on that tag's code).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, e.g. v0.3.1"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
    - name: Create or update the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
        if [ "$TAG" != "v$version" ]; then
          echo "Tag $TAG does not match the version in Cargo.toml ($version)" >&2
          exit 1
        fi

        # The release notes are this version's section of CHANGELOG.md.
        awk -v heading="## [$version]" '
          index($0, heading) == 1 { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > notes.md
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "CHANGELOG.md has no section for $version" >&2
          exit 1
        fi
        printf '\nhttps://crates.io/crates/cdp-lite/%s\n' "$version" >> notes.md

        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release edit "$TAG" --title "$TAG" --notes-file notes.md
        else
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
        fi
